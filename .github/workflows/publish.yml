name: publish

# Publishes to PyPI when a GitHub release is published, with PyPI's trusted
# publishing: no password or token is stored anywhere. One-time setup on PyPI:
# add a pending publisher for project "edgeorluck", owner "Sakke-code",
# repository "edge-or-luck", workflow "publish.yml", environment "pypi".
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
