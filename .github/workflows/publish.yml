name: publish

# Publishes to PyPI when a version tag (v2.0.0, ...) is pushed, with PyPI's trusted
# publishing: no password or token is stored anywhere. One-time setup on PyPI: a
# trusted publisher for project "edgeorluck", owner "Sakke-code", repository
# "edge-or-luck", workflow "publish.yml", environment "pypi". The tag must match the
# package version, and the whole test suite must pass on the tagged commit first.
# (Only tags trigger it: a GitHub release made in the web page pushes its tag too, so
# a second trigger on releases would publish twice.)
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The tests pass on this commit
        run: python -m pip install -e ".[dev]" && python -m pytest -q
      - name: Build
        run: python -m pip install build && python -m build
      - name: The tag matches the version
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'ENGINE_VERSION = \"(.+?)\"', pathlib.Path('src/edgeorluck/judge.py').read_text()).group(1))")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
